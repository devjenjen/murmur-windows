name: Real-model smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  MURMUR_TEST_MODELS_ROOT: ${{ github.workspace }}/windows/artifacts/real-model/models

jobs:
  real-model:
    name: Download and exercise speech models
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      - name: Restore
        run: dotnet restore windows/Murmur.sln --runtime win-x64

      - name: Build
        run: >
          dotnet build windows/Murmur.sln
          --no-restore
          --configuration Release
          --no-incremental
          -warnaserror

      - name: Run real-model tests
        run: >
          dotnet test windows/tests/Murmur.Speech.Tests/Murmur.Speech.Tests.csproj
          --no-build
          --configuration Release
          --filter "Category=RealModel"
          --logger "trx;LogFilePrefix=real-model"
          --logger "console;verbosity=normal"
          --results-directory windows/artifacts/real-model-test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-model-test-results
          path: windows/artifacts/real-model-test-results
          if-no-files-found: error
