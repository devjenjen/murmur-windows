name: Windows release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: beta
        type: choice
        options: [beta, stable]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-package:
    name: Build and verify Windows release draft
    runs-on: windows-latest
    timeout-minutes: 100
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      tag_sha: ${{ steps.resolve.outputs.source_sha }}
      channel: ${{ steps.channel.outputs.channel }}

    steps:
      - name: Resolve workflow inputs
        id: channel
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag must use vMAJOR.MINOR.PATCH: '$tag'." }
          $channel = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_CHANNEL } else { 'beta' }
          if ($channel -notin @('beta', 'stable')) { throw "Unsupported release channel: '$channel'." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.channel.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify tag SHA
        id: resolve
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.channel.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $results = @(& ./windows/scripts/Resolve-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG -RepositoryDirectory $env:GITHUB_WORKSPACE)
          if ($results.Count -ne 1) { throw 'Release version resolution must return exactly one result.' }
          $resolved = $results[0]
          if ($resolved.Tag -cne $env:RELEASE_TAG) { throw 'Resolved release tag does not match the requested tag.' }
          if ($resolved.Version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Resolved release version must use MAJOR.MINOR.PATCH.' }
          if ($resolved.SourceSha -notmatch '^[0-9a-fA-F]{40}$') { throw 'Resolved source SHA must be a full Git commit hash.' }
          "tag=$($resolved.Tag)" >> $env:GITHUB_OUTPUT
          "version=$($resolved.Version)" >> $env:GITHUB_OUTPUT
          "source_sha=$($resolved.SourceSha)" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      - name: Verification gate (unit, real-model, package audit)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          MURMUR_TEST_MODELS_ROOT: ${{ github.workspace }}/windows/artifacts/real-model/models
        run: |
          pwsh -NoProfile -File windows/scripts/Verify-Release.ps1 `
            -Tag $env:RELEASE_TAG `
            -IncludeRealModels `
            -OutputDirectory artifacts/release-verification `
            -ReportPath windows/artifacts/release-verification/verification-report.md

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification
          path: windows/artifacts/release-verification
          if-no-files-found: warn

      - name: Publish self-contained application
        shell: pwsh
        env:
          MURMUR_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'windows/artifacts/release'
          $publishPath = Join-Path $releaseRoot 'publish/win-x64'
          New-Item -ItemType Directory -Path $publishPath -Force | Out-Null
          dotnet publish windows/src/Murmur.App/Murmur.App.csproj `
            --configuration Release `
            --no-restore `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -p:Version=$env:MURMUR_VERSION `
            -p:VersionPrefix=$env:MURMUR_VERSION `
            -p:AssemblyVersion=$env:MURMUR_VERSION `
            -p:FileVersion=$env:MURMUR_VERSION `
            -o $publishPath
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE." }
          pwsh -NoProfile -File windows/scripts/Test-ReleasePackage.ps1 -PublishDirectory $publishPath -ExpectedVersion $env:MURMUR_VERSION
          Compress-Archive -Path (Join-Path $publishPath '*') -DestinationPath (Join-Path $releaseRoot "Murmur-$env:MURMUR_VERSION-win-x64.zip") -CompressionLevel Optimal

      - name: Build installer
        shell: pwsh
        env:
          MURMUR_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          $candidates = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe')
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          $iscc = $candidates | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($iscc)) { throw 'Inno Setup compiler (ISCC.exe) not found on runner.' }
          $innoArguments = @('/O+', "/DMyAppVersion=$env:MURMUR_VERSION", 'windows/installer/Murmur.iss')
          & $iscc @innoArguments
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

      - name: Validate package, installer, and archive contents
        shell: pwsh
        env:
          MURMUR_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'windows/artifacts/release'
          $publishPath = Join-Path $releaseRoot 'publish/win-x64'
          $archivePath = Join-Path $releaseRoot "Murmur-$env:MURMUR_VERSION-win-x64.zip"
          $installerPath = Join-Path $releaseRoot "installer/Murmur-Setup-v$env:MURMUR_VERSION.exe"
          pwsh -NoProfile -File windows/scripts/Test-ReleasePackage.ps1 `
            -PublishDirectory $publishPath `
            -ExpectedVersion $env:MURMUR_VERSION `
            -ArchivePath $archivePath `
            -InstallerPath $installerPath

      - name: Write build metadata and checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'windows/artifacts/release'
          $packageList = Join-Path $env:GITHUB_WORKSPACE 'windows/artifacts/package-list.json'
          dotnet package list --project windows/Murmur.sln --no-restore --include-transitive --format json 1> $packageList
          if ($LASTEXITCODE -ne 0) { throw "Package list failed with exit code $LASTEXITCODE." }
          pwsh -NoProfile -File windows/scripts/New-ReleaseBuildInfo.ps1 `
            -Tag $env:RELEASE_TAG `
            -Channel $env:RELEASE_CHANNEL `
            -PackageListPath $packageList `
            -OutputPath (Join-Path $releaseRoot 'build-info.json') `
            -RepositoryDirectory $env:GITHUB_WORKSPACE
          $hashTargets = @(
            (Join-Path $releaseRoot "Murmur-$env:RELEASE_VERSION-win-x64.zip"),
            (Get-ChildItem (Join-Path $releaseRoot 'installer') -Filter 'Murmur-Setup-v*.exe' -File | Select-Object -First 1).FullName,
            (Join-Path $releaseRoot 'build-info.json')
          )
          $lines = foreach ($target in $hashTargets) {
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Checksum target missing: $target" }
            "$((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($target))"
          }
          [IO.File]::WriteAllLines((Join-Path $releaseRoot 'SHA256SUMS.txt'), $lines, [Text.Encoding]::ASCII)

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            windows/artifacts/release/Murmur-${{ steps.resolve.outputs.version }}-win-x64.zip
            windows/artifacts/release/installer/Murmur-Setup-v${{ steps.resolve.outputs.version }}.exe
            windows/artifacts/release/build-info.json
            windows/artifacts/release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish verified GitHub draft
    needs: build-package
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-package.outputs.tag }}
          persist-credentials: false

      - name: Download verified assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: windows/artifacts/release

      - name: Create or update draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MURMUR_TAG: ${{ needs.build-package.outputs.tag }}
          MURMUR_REPOSITORY: ${{ github.repository }}
          MURMUR_CHANNEL: ${{ needs.build-package.outputs.channel }}
        run: |
          $isPrerelease = $env:MURMUR_CHANNEL -eq 'beta'
          pwsh -NoProfile -File windows/scripts/Publish-ReleaseDraft.ps1 `
            -Tag $env:MURMUR_TAG `
            -Repository $env:MURMUR_REPOSITORY `
            -AssetsDirectory (Join-Path $env:GITHUB_WORKSPACE 'windows/artifacts/release') `
            -NotesPath (Join-Path $env:GITHUB_WORKSPACE 'docs/release/release-notes.md') `
            -Prerelease $isPrerelease `
            -RepositoryDirectory $env:GITHUB_WORKSPACE
